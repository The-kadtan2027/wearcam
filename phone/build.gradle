plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gajuk.wearcam'
    compileSdk 37

    defaultConfig {
        applicationId "com.gajuk.wearcam"
        minSdk 29
        targetSdk 35
        versionCode 170
        versionName "1.7.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }
}

// Bundle the watch APK so the phone app can export/share it for sideloading.
tasks.register('copyWatchApk', Copy) {
    dependsOn ':watch:assembleRelease'
    from "${rootProject.projectDir}/watch/build/outputs/apk/release/watch-release.apk"
    into "${buildDir}/generated/assets"
    rename { 'watch.apk' }
}

tasks.named('preBuild') {
    dependsOn 'copyWatchApk'
}

dependencies {
    implementation project(":common")
    implementation "com.flyfishxu:kadb:2.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    testImplementation "junit:junit:4.13.2"
}
