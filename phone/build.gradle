plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gajuk.wearcam'
    compileSdk 35

    defaultConfig {
        applicationId "com.gajuk.wearcam"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }
}

// Bundle the watch APK so the phone app can export/share it for sideloading.
tasks.register('copyWatchApk', Copy) {
    dependsOn ':watch:assembleDebug'
    from "${rootProject.projectDir}/watch/build/outputs/apk/debug/watch-debug.apk"
    into "${buildDir}/generated/assets"
    rename { 'watch.apk' }
}

tasks.named('preBuild') {
    dependsOn 'copyWatchApk'
}

dependencies {
    implementation project(":common")
    testImplementation "junit:junit:4.13.2"
}
