plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gajuk.wearcam'
    compileSdk 35

    defaultConfig {
        applicationId "com.gajuk.wearcam"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(":common")
    testImplementation "junit:junit:4.13.2"
}
