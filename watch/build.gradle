plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gajuk.wearcam.watch'
    compileSdk 37

    defaultConfig {
        applicationId "com.gajuk.wearcam.watch"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":common")
    testImplementation "junit:junit:4.13.2"
}
